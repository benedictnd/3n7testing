<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Post-Training Feedback - 3&7 Platform</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="static/css/styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body class="bg-gray-50 font-poppins">
    <header class="bg-white shadow-sm fixed top-0 w-full z-50">
        <div class="container mx-auto px-4 py-4 flex justify-between items-center">
            <img src="static/image/Logo Black.png" alt="3&7 Logo" class="h-10">
            <nav class="hidden md:flex space-x-6">
                <a href="athlete-dashboard.html" class="text-gray-600 hover:text-blue-600">Dashboard</a>
                <a href="#" class="text-blue-600 font-medium">Training Feedback</a>
                <a href="#" class="text-gray-600 hover:text-blue-600">History</a>
                <a href="#" class="text-gray-600 hover:text-blue-600">Profile</a>
            </nav>
        </div>
    </header>

    <main class="container mx-auto px-4 pt-24 pb-12">
        <div class="max-w-2xl mx-auto">
            <h1 class="text-3xl font-semibold text-gray-800 mb-8">Post-Training Feedback</h1>

            <div id="sessionInfo" class="bg-white rounded-lg shadow-sm p-6 mb-8">
                <h2 class="text-xl font-medium text-gray-700 mb-4">Training Session Details</h2>
                <div class="grid grid-cols-2 gap-4 text-gray-600">
                    <div>
                        <p class="font-medium">Date:</p>
                        <p id="sessionDate">Loading...</p>
                    </div>
                    <div>
                        <p class="font-medium">Time:</p>
                        <p id="sessionTime">Loading...</p>
                    </div>
                    <div>
                        <p class="font-medium">Type:</p>
                        <p id="sessionType">Loading...</p>
                    </div>
                    <div>
                        <p class="font-medium">Coach:</p>
                        <p id="coachName">Loading...</p>
                    </div>
                </div>
            </div>

            <form id="feedbackForm" class="space-y-8">
                <div class="bg-white rounded-lg shadow-sm p-6">
                    <h2 class="text-xl font-medium text-gray-700 mb-6">Your Feedback</h2>

                    <!-- Training Quality Rating -->
                    <div class="mb-6">
                        <label class="block text-gray-600 mb-2">Training Quality (1-5)</label>
                        <div class="flex space-x-4">
                            <input type="range" min="1" max="5" value="3" class="w-full" id="qualityRange">
                            <span id="qualityValue" class="text-gray-600 w-8">3</span>
                        </div>
                        <div class="flex justify-between text-sm text-gray-500 mt-1">
                            <span>Poor</span>
                            <span>Excellent</span>
                        </div>
                    </div>

                    <!-- Session Expectations Rating -->
                    <div class="mb-6">
                        <label class="block text-gray-600 mb-2">Did the session meet your expectations? (1-5)</label>
                        <div class="flex space-x-4">
                            <input type="range" min="1" max="5" value="3" class="w-full" id="expectationsRange">
                            <span id="expectationsValue" class="text-gray-600 w-8">3</span>
                        </div>
                        <div class="flex justify-between text-sm text-gray-500 mt-1">
                            <span>Not at all</span>
                            <span>Exceeded</span>
                        </div>
                    </div>

                    <!-- Body Condition Rating -->
                    <div class="mb-6">
                        <label class="block text-gray-600 mb-2">Current Body Condition (1-10)</label>
                        <div class="flex space-x-4">
                            <input type="range" min="1" max="10" value="5" class="w-full" id="conditionRange">
                            <span id="conditionValue" class="text-gray-600 w-8">5</span>
                        </div>
                        <div class="flex justify-between text-sm text-gray-500 mt-1">
                            <span>Poor</span>
                            <span>Excellent</span>
                        </div>
                    </div>

                    <!-- Training Intensity Rating -->
                    <div class="mb-6">
                        <label class="block text-gray-600 mb-2">Training Intensity (1-10)</label>
                        <div class="flex space-x-4">
                            <input type="range" min="1" max="10" value="5" class="w-full" id="intensityRange">
                            <span id="intensityValue" class="text-gray-600 w-8">5</span>
                        </div>
                        <div class="flex justify-between text-sm text-gray-500 mt-1">
                            <span>Very Light</span>
                            <span>Very Intense</span>
                        </div>
                    </div>

                    <!-- Additional Notes -->
                    <div class="mb-6">
                        <label class="block text-gray-600 mb-2">Additional Notes</label>
                        <textarea 
                            class="w-full p-3 border rounded-lg" 
                            rows="4" 
                            placeholder="Share your thoughts about the training session..."
                        ></textarea>
                    </div>
                </div>

                <!-- Submit Button -->
                <div class="flex justify-end">
                    <button type="submit" class="bg-blue-600 text-white px-8 py-3 rounded-lg hover:bg-blue-700">
                        Submit Feedback
                    </button>
                </div>
            </form>
        </div>
    </main>

    <script>
        // Update range value displays
        function updateRangeValue(rangeId, valueId) {
            const range = document.getElementById(rangeId);
            const value = document.getElementById(valueId);
            value.textContent = range.value;
            
            range.addEventListener('input', () => {
                value.textContent = range.value;
            });
        }

        updateRangeValue('qualityRange', 'qualityValue');
        updateRangeValue('expectationsRange', 'expectationsValue');
        updateRangeValue('conditionRange', 'conditionValue');
        updateRangeValue('intensityRange', 'intensityValue');

        // Check if feedback is allowed (after session end time)
        function checkFeedbackAvailability() {
            const currentTime = new Date();
            const sessionEndTime = new Date(sessionEndTimeFromServer); // This should be set from server

            if (currentTime < sessionEndTime) {
                alert('Feedback can only be submitted after the training session has ended.');
                window.location.href = 'athlete-dashboard.html';
            }
        }

        // Form submission
        document.getElementById('feedbackForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const feedbackData = {
                trainingSessionId: parseInt(sessionID), // This should be set from the URL parameter
                trainingQuality: parseInt(document.getElementById('qualityRange').value),
                expectations: parseInt(document.getElementById('expectationsRange').value),
                bodyCondition: parseInt(document.getElementById('conditionRange').value),
                intensity: parseInt(document.getElementById('intensityRange').value),
                notes: document.querySelector('textarea').value
            };

            try {
                // Submit feedback data to API
                const response = await fetch('/api/training/feedback', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': 'Bearer ' + localStorage.getItem('token')
                    },
                    body: JSON.stringify(feedbackData)
                });
                
                if (!response.ok) {
                    throw new Error('Failed to submit feedback');
                }
                
                // Show success message
                alert('Feedback submitted successfully!');
                
                // Redirect to training history page
                window.location.href = '/history';
            } catch (error) {
                console.error('Error submitting feedback:', error);
                alert('Error submitting feedback. Please try again.');
            }
        });

        // Load session details (this would be replaced with actual API call)
        function loadSessionDetails() {
            // Simulate loading session details from server
            document.getElementById('sessionDate').textContent = new Date().toLocaleDateString();
            document.getElementById('sessionTime').textContent = '9:00 AM - 11:00 AM';
            document.getElementById('sessionType').textContent = 'Core Training';
            document.getElementById('coachName').textContent = 'Coach Smith';
        }

        loadSessionDetails();
    </script>
</body>
</html>
