<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome to 3&7 - Training & Recovery Platform</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <style>
        .video-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 50;
            background: black;
        }

        .skip-button {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 51;
            opacity: 0.7;
            transition: opacity 0.3s;
        }

        .skip-button:hover {
            opacity: 1;
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
    </style>
</head>
<body class="bg-black">
    <div class="video-container">
        <video id="welcomeVideo" autoplay playsinline muted>
            <source src="static/video animation/Welcome Video.mp4" type="video/mp4">
            Your browser does not support the video tag.
        </video>
    </div>

    <button class="skip-button px-6 py-2 bg-white/20 backdrop-blur-sm text-white rounded-lg hover:bg-white/30 transition-all font-poppins">
        Skip
    </button>

    <script>
        const video = document.getElementById('welcomeVideo');
        const skipButton = document.querySelector('.skip-button');
        const role = new URLSearchParams(window.location.search).get('role') || 'athlete';
        
        // Function to redirect based on role
        function redirectToRole() {
            const redirectMap = {
                'athlete': 'athlete-dashboard.html',
                'coach': 'coach-dashboard.html',
                'stakeholder': 'stakeholder-dashboard.html',
                'support': 'support-dashboard.html'
            };
            window.location.href = redirectMap[role] || 'athlete-dashboard.html';
        }

        // Video ended event
        video.addEventListener('ended', redirectToRole);

        // Set timeout for exact duration
        setTimeout(redirectToRole, 3800); // 3.8 seconds

        // Skip button click
        skipButton.addEventListener('click', () => {
            video.pause();
            redirectToRole();
        });
    </script>
</body>
</html>
