<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In - Training & Recovery Platform</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="static/css/styles.css">
</head>
<body class="font-inter">
    <div class="min-h-screen flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8 relative"
         style="background: linear-gradient(rgba(0, 0, 0, 0.7), rgba(0, 0, 0, 0.7)), url('static/image/Background img.png') center/cover no-repeat;">
        <div class="absolute top-6 left-6">
            <a href="index.html">
                <img src="static/image/Logo Black.png" alt="Logo" class="h-10 w-auto object-contain brightness-0 invert">
            </a>
        </div>
        <div class="max-w-sm w-full space-y-6 bg-white/10 backdrop-blur-md p-6 rounded-xl shadow-lg">
            <div class="text-center">
                <h2 class="text-2xl font-bold text-white mb-2">Welcome Back</h2>
                <p class="text-sm text-gray-200">Please sign in to your account</p>
            </div>
            
            <form class="mt-6 space-y-4">
                <div class="space-y-3">
                    <div>
                        <label for="email" class="block text-sm font-medium text-white">Email address</label>
                        <input type="email" id="email" name="email" required 
                            class="mt-1 block w-full px-3 py-2 bg-white/10 border border-gray-300/30 rounded-lg focus:ring-2 focus:ring-blue-600 focus:border-transparent text-sm text-white placeholder-gray-300">
                    </div>
                    <div>
                        <label for="password" class="block text-sm font-medium text-white">Password</label>
                        <input type="password" id="password" name="password" required 
                            class="mt-1 block w-full px-3 py-2 bg-white/10 border border-gray-300/30 rounded-lg focus:ring-2 focus:ring-blue-600 focus:border-transparent text-sm text-white placeholder-gray-300">
                    </div>
                </div>

                <div class="flex items-center justify-between text-sm">
                    <div class="flex items-center">
                        <input type="checkbox" id="remember-me" class="h-4 w-4 text-blue-600 rounded border-gray-300/30 bg-white/10">
                        <label for="remember-me" class="ml-2 block text-white">Remember me</label>
                    </div>
                    <a href="#" class="text-blue-400 hover:text-blue-300">Forgot password?</a>
                </div>

                <button type="submit" class="w-full py-2 px-4 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition-colors text-sm font-medium">
                    Sign In
                </button>

                <div class="text-center">
                    <p class="text-sm text-gray-200">
                        Don't have an account? 
                        <a href="signup.html" class="text-blue-400 hover:text-blue-300 font-medium">Sign up</a>
                    </p>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
