[pytest]
# Default pytest settings for the API test suite
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Log settings
log_cli = True
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s (%(filename)s:%(lineno)s)
log_cli_date_format = %Y-%m-%d %H:%M:%S

# Disable warnings in test output
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning

# Default markers
markers =
    security: tests that verify security aspects of the API
    performance: tests that measure API performance
    integration: end-to-end integration tests for API workflows
    rate_limit: tests that verify rate limiting functionality
    auth: tests that verify authentication functionality

# Default test options
addopts = -v --strict-markers 