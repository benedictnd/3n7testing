    <script src="https://unpkg.com/@popperjs/core@2"></script>
    <script src="https://unpkg.com/tippy.js@6"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'deep-navy': '#09104E',
                        'electric-blue': '#353DFF',
                    },
                    fontFamily: {
                        'poppins': ['Poppins', 'sans-serif'],
                    }
                }
            }
        }

    <style>
        .info-icon {
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background-color: rgba(255, 255, 255, 0.2);
            margin-left: 8px;
            font-size: 12px;
        }

        .tippy-box {
            background-color: rgba(9, 16, 78, 0.95) !important;
            color: white !important;
            border-radius: 8px !important;
            font-size: 14px !important;
            max-width: 300px !important;
            padding: 8px !important;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            z-index: 1000;
        }

        .modal.active {
            display: flex;
            animation: fadeIn 0.3s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .modal-content {
            background: #09104E;
            border-radius: 12px;
            padding: 24px;
            max-width: 600px;
            width: 90%;
            max-height: 90vh;
            overflow-y: auto;
            margin: auto;
            position: relative;
            transform: translateY(-20px);
            opacity: 0;
            transition: all 0.3s ease-in-out;
        }

        .modal.active .modal-content {
            transform: translateY(0);
            opacity: 1;
        }

        select option {
            background-color: white !important;
            color: black !important;
        }

        .selected-sport {
            display: inline-block;
            padding: 4px 10px;
            background-color: rgba(255, 255, 255, 0.2);
            border-radius: 9999px;
            margin-right: 8px;
            margin-bottom: 8px;
            font-size: 14px;
        }

        .selected-sport button {
            margin-left: 6px;
            font-size: 14px;
            opacity: 0.7;
        }

        .selected-sport button:hover {
            opacity: 1;
        }
    </style>

                                Club's Email / Coach's Email
                                <span class="text-red-400">*</span>
                                <span class="info-icon" data-tippy-content="Add up to 5 email addresses">i</span>
                            </label>
                            <div class="space-y-2">
                                <div class="flex gap-2">
                                    <input type="email" required
                                        class="w-full px-4 py-2 bg-white/10 border border-gray-300/30 rounded-lg focus:ring-2 focus:ring-electric-blue focus:border-transparent text-white">
                                    <button type="button" onclick="addEmailField()"
                                        class="px-4 py-2 bg-electric-blue text-white rounded-lg hover:bg-blue-600">
                                        +
                                    </button>
                                </div>
                            </div>
                        </div>

                        <!-- Organisation Registration -->
                        <div>
                            <div class="flex justify-between items-center mb-2">
                                <label class="block text-sm font-medium text-white">
                                    Can't find your organisation?
                                </label>
                                <button type="button" onclick="openOrgModal()" 
                                    class="px-4 py-2 bg-electric-blue text-white rounded-lg hover:bg-blue-600 text-sm">
                                    Register Now
                                </button>
                            </div>
                        </div>

                        <!-- Previous organizations -->
                        <div>
                            <label class="flex items-center space-x-3">
                                <input type="checkbox" id="previousOrg" class="form-checkbox text-electric-blue h-5 w-5"
                                    onchange="togglePreviousOrgFields(this)">
                                <span class="text-white">Have you ever represented another organisation?</span>
                            </label>
                            <div id="previousOrgFields" class="hidden space-y-2 mt-2">
                                <div id="prevOrgContainer">
                                    <div class="flex gap-2 mt-2">
                                        <input type="text" placeholder="Organisation name"
                                            class="w-full px-4 py-2 bg-white/10 border border-gray-300/30 rounded-lg focus:ring-2 focus:ring-electric-blue focus:border-transparent text-white placeholder-gray-400">
                                        <button type="button" onclick="addPrevOrgField()"
                                            class="px-4 py-2 bg-electric-blue text-white rounded-lg hover:bg-blue-600">
                                            +
                                        </button>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <!-- Regional team -->
                        <div>
                            <label class="flex items-center space-x-3">
                                <input type="checkbox" id="regionalTeam" class="form-checkbox text-electric-blue h-5 w-5"
                                    onchange="toggleRegionalTeamFields(this)">
                                <span class="text-white">Are you currently part of a regional team? (e.g., Jakarta Fencing Team)</span>
                            </label>
                            <div id="regionalTeamFields" class="hidden space-y-2 mt-2">
                                <div id="regionalTeamContainer">
                                    <div class="flex gap-2 mt-2">
                                        <input type="text" placeholder="Team name"
                                            class="w-full px-4 py-2 bg-white/10 border border-gray-300/30 rounded-lg focus:ring-2 focus:ring-electric-blue focus:border-transparent text-white placeholder-gray-400">
                                        <button type="button" onclick="addRegionalTeamField()"
                                            class="px-4 py-2 bg-electric-blue text-white rounded-lg hover:bg-blue-600">
                                            +
                                        </button>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <!-- National team -->
                        <div>
                            <label class="flex items-center space-x-3">
                                <input type="checkbox" id="nationalTeam" class="form-checkbox text-electric-blue h-5 w-5">
                                <span class="text-white">Are you currently part of a national team?</span>
                            </label>
                        </div>

                        <!-- Sporting Bodies -->
                        <div>
                            <label class="flex items-center space-x-3">
                                <input type="checkbox" id="sportingBodies" class="form-checkbox text-electric-blue h-5 w-5"
                                    onchange="toggleSportingBodiesFields(this)">
                                <span class="text-white">Are you an active member of the sporting bodies? (regional or national level)</span>
                            </label>
                            <div id="sportingBodiesFields" class="hidden space-y-2 mt-2">
                                <div class="flex gap-2 mt-2">
                                    <input type="text" placeholder="Organisation name"
                                        class="w-full px-4 py-2 bg-white/10 border border-gray-300/30 rounded-lg focus:ring-2 focus:ring-electric-blue focus:border-transparent text-white placeholder-gray-400">
                                </div>
                                <div class="flex gap-2 mt-2">
                                    <input type="text" placeholder="Your position"
                                        class="w-full px-4 py-2 bg-white/10 border border-gray-300/30 rounded-lg focus:ring-2 focus:ring-electric-blue focus:border-transparent text-white placeholder-gray-400">
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Additional Fields -->
                <div class="space-y-6">
                    <h3 class="text-xl font-semibold text-white">Additional Information</h3>
                    
                    <div class="space-y-4">
                        <!-- Profile Picture -->
                        <div>
                            <label class="block text-sm font-medium text-white mb-2">
                                Profile Picture
                                <span class="text-gray-400">(PNG/JPEG, max 10MB)</span>
                            </label>
                            <input type="file" accept=".jpg,.jpeg,.png" max="10485760"
                                class="w-full px-4 py-2 bg-white/10 border border-gray-300/30 rounded-lg focus:ring-2 focus:ring-electric-blue focus:border-transparent text-white">
                        </div>
                    </div>
                </div>

                <!-- Submit Button -->
                <div class="flex justify-center">
                    <button type="submit"
                        class="px-8 py-3 bg-transparent text-white rounded-lg border-2 border-white hover:bg-white hover:text-[#09104E] transition-colors font-medium">
                        Submit Registration
                    </button>
                </div>
            </form>

            <!-- Back Link -->
            <div class="text-center mt-8">
                <a href="role-selection.html" class="text-gray-300 hover:text-white transition-colors">
                    ← Back to Role Selection
                </a>
            </div>
        </div>
    </div>

    <!-- Sport Selection Modal -->
    <div id="sport-modal" class="modal">
        <div class="modal-content">
            <div class="flex justify-between items-center mb-6">
                <h3 class="text-xl font-semibold text-white">Select Your Sports (max 5)</h3>
                <button type="button" onclick="closeSportModal()" class="text-white hover:text-gray-300">×</button>
            </div>
            <input type="text" id="sportSearch" placeholder="Search sports..."
                class="w-full px-4 py-2 mb-4 bg-white/10 border border-gray-300/30 rounded-lg focus:ring-2 focus:ring-electric-blue focus:border-transparent text-white placeholder-gray-400">
            <div id="sportList" class="max-h-[60vh] overflow-y-auto space-y-2">
                <!-- Sports will be populated by JavaScript -->
            </div>
        </div>
    </div>

    <!-- Organisation Registration Modal -->
    <div id="org-modal" class="modal">
        <div class="modal-content">
            <div class="flex justify-between items-center mb-6">
                <h3 class="text-xl font-semibold text-white">Register New Organisation</h3>
                <button type="button" onclick="closeOrgModal()" class="text-white hover:text-gray-300">×</button>
            </div>
            <div class="space-y-4">
                <!-- Organisation Name -->
                <div>
                    <label class="block text-sm font-medium text-white mb-2">
                        Organisation Name
                        <span class="text-red-400">*</span>
                    </label>
                    <input type="text" id="orgName" required
                        class="w-full px-4 py-2 bg-white/10 border border-gray-300/30 rounded-lg focus:ring-2 focus:ring-electric-blue focus:border-transparent text-white">
                </div>

                <!-- Year of Establishment -->
                <div>
                    <label class="block text-sm font-medium text-white mb-2">
                        Year of Establishment
                        <span class="text-red-400">*</span>
                    </label>
                    <input type="text" id="yearEstablished" required
                        class="w-full px-4 py-2 bg-white/10 border border-gray-300/30 rounded-lg focus:ring-2 focus:ring-electric-blue focus:border-transparent text-white">
                </div>

                <!-- Address -->
                <div>
                    <label class="block text-sm font-medium text-white mb-2">
                        Address
                        <span class="text-red-400">*</span>
                    </label>
                    <input type="text" id="orgAddress" required
                        class="w-full px-4 py-2 bg-white/10 border border-gray-300/30 rounded-lg focus:ring-2 focus:ring-electric-blue focus:border-transparent text-white">
                </div>

                <!-- Nation -->
                <div>
                    <label class="block text-sm font-medium text-white mb-2">
                        Nation
                        <span class="text-red-400">*</span>
                    </label>
                    <select required id="orgNation"
                        class="w-full px-4 py-2 bg-white/10 border border-gray-300/30 rounded-lg focus:ring-2 focus:ring-electric-blue focus:border-transparent text-white">
                        <option value="" disabled selected class="bg-white text-black">Select nation</option>
                        <!-- Options are the same as nationality dropdown -->
                        <!-- Shortened for brevity, would include all same countries as the nationality dropdown -->
                        <option value="Indonesia" class="bg-white text-black">Indonesia</option>
                        <option value="United States" class="bg-white text-black">United States</option>
                        <option value="United Kingdom" class="bg-white text-black">United Kingdom</option>
                    </select>
                </div>

                <!-- Professional Organisation -->
                <div>
                    <label class="flex items-center space-x-3">
                        <input type="checkbox" id="isProfessional" class="form-checkbox text-electric-blue h-5 w-5">
                        <span class="text-white">
                            Is this a professional organisation?
                            <span class="info-icon" data-tippy-content="Championship team, achievement oriented.">i</span>
                        </span>
                    </label>
                </div>

                <!-- Pre-athlete Preparation -->
                <div>
                    <label class="flex items-center space-x-3">
                        <input type="checkbox" id="isPreAthlete" class="form-checkbox text-electric-blue h-5 w-5">
                        <span class="text-white">
                            Is this a pre-athlete preparation organisation?
                            <span class="info-icon" data-tippy-content="For early age, preparation stage before professional career.">i</span>
                        </span>
                    </label>
                </div>

                <!-- Government Affiliated -->
                <div>
                    <label class="flex items-center space-x-3">
                        <input type="checkbox" id="isGovernment" class="form-checkbox text-electric-blue h-5 w-5"
                            onchange="toggleGovernmentFields(this)">
                        <span class="text-white">
                            Is this affiliated to government?
                            <span class="info-icon" data-tippy-content="Regional team and national team.">i</span>
                        </span>
                    </label>
                    <div id="governmentFields" class="hidden mt-2">
                        <input type="text" placeholder="Complete organisation name (e.g. East Java Basketball Team)" required
                            class="w-full px-4 py-2 bg-white/10 border border-gray-300/30 rounded-lg focus:ring-2 focus:ring-electric-blue focus:border-transparent text-white placeholder-gray-400">
                    </div>
                </div>

                <!-- Club Logo -->
                <div>
                    <label class="block text-sm font-medium text-white mb-2">
                        Club's Logo
                        <span class="text-gray-400">(PNG/JPEG, max 10MB)</span>
                    </label>
                    <input type="file" accept=".jpg,.jpeg,.png" max="10485760"
                        class="w-full px-4 py-2 bg-white/10 border border-gray-300/30 rounded-lg focus:ring-2 focus:ring-electric-blue focus:border-transparent text-white">
                </div>

                <!-- Register Button -->
                <div class="flex justify-center mt-6">
                    <button type="button" onclick="registerOrganisation()"
                        class="px-8 py-3 bg-electric-blue text-white rounded-lg hover:bg-blue-600 transition-colors font-medium">
                        Register Organisation
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Initialize tooltips
        document.addEventListener('DOMContentLoaded', function() {
            tippy('[data-tippy-content]', {
                placement: 'right',
                arrow: true,
                animation: 'scale',
            });
        });

        // Email field management
        let emailCount = 1;
        
        function addEmailField() {
            if (emailCount < 5) {
                emailCount++;
                const container = document.getElementById('email-container').querySelector('.space-y-2');
                const div = document.createElement('div');
                div.className = 'flex gap-2';
                div.innerHTML = `
                    <input type="email" required
                        class="w-full px-4 py-2 bg-white/10 border border-gray-300/30 rounded-lg focus:ring-2 focus:ring-electric-blue focus:border-transparent text-white">
                    <button type="button" onclick="removeEmailField(this)"
                        class="px-4 py-2 bg-red-500 text-white rounded-lg hover:bg-red-600">
                        -
                    </button>
                `;
                container.appendChild(div);
            }
        }

        function removeEmailField(button) {
            button.parentElement.remove();
            emailCount--;
        }

        // Previous organization fields
        let prevOrgCount = 1;
        
        function togglePreviousOrgFields(checkbox) {
            const fields = document.getElementById('previousOrgFields');
            fields.classList.toggle('hidden', !checkbox.checked);
        }
        
        function addPrevOrgField() {
            if (prevOrgCount < 5) {
                prevOrgCount++;
                const container = document.getElementById('prevOrgContainer');
                const div = document.createElement('div');
                div.className = 'flex gap-2 mt-2';
                div.innerHTML = `
                    <input type="text" placeholder="Organisation name"
                        class="w-full px-4 py-2 bg-white/10 border border-gray-300/30 rounded-lg focus:ring-2 focus:ring-electric-blue focus:border-transparent text-white placeholder-gray-400">
                    <button type="button" onclick="removePrevOrgField(this)"
                        class="px-4 py-2 bg-red-500 text-white rounded-lg hover:bg-red-600">
                        -
                    </button>
                `;
                container.appendChild(div);
            }
        }
        
        function removePrevOrgField(button) {
            button.parentElement.remove();
            prevOrgCount--;
        }

        // Regional team fields
        let regionalTeamCount = 1;
        
        function toggleRegionalTeamFields(checkbox) {
            const fields = document.getElementById('regionalTeamFields');
            fields.classList.toggle('hidden', !checkbox.checked);
        }
        
        function addRegionalTeamField() {
            if (regionalTeamCount < 5) {
                regionalTeamCount++;
                const container = document.getElementById('regionalTeamContainer');
                const div = document.createElement('div');
                div.className = 'flex gap-2 mt-2';
                div.innerHTML = `
                    <input type="text" placeholder="Team name"
                        class="w-full px-4 py-2 bg-white/10 border border-gray-300/30 rounded-lg focus:ring-2 focus:ring-electric-blue focus:border-transparent text-white placeholder-gray-400">
                    <button type="button" onclick="removeRegionalTeamField(this)"
                        class="px-4 py-2 bg-red-500 text-white rounded-lg hover:bg-red-600">
                        -
                    </button>
                `;
                container.appendChild(div);
            }
        }
        
        function removeRegionalTeamField(button) {
            button.parentElement.remove();
            regionalTeamCount--;
        }

        // Sporting Bodies fields
        function toggleSportingBodiesFields(checkbox) {
            const fields = document.getElementById('sportingBodiesFields');
            fields.classList.toggle('hidden', !checkbox.checked);
        }

        // Government fields
        function toggleGovernmentFields(checkbox) {
            const fields = document.getElementById('governmentFields');
            fields.classList.toggle('hidden', !checkbox.checked);
        }

        // Sports selection
        const sports = [
            "Aikido", "Archery", "Athletics", "Badminton", "Baseball", "Basketball", 
            "Billiard", "Bowling", "Boxing", "Bridge", "Canoeing", "Climbing", 
            "Cricket", "Cycling", "Dance", "Diving", "e-Sports", "Equestrian", 
            "Fencing", "Football", "Futsal", "Golf", "Gymnastics", "Handball", 
            "High Jump", "Hockey", "Ice Skating", "Jet Ski", "Judo", "Kabaddi", 
            "Karate", "Kempo", "Kenjutsu", "Marathon", "Mountain Bike", "Muay Thai", 
            "Multi-Sport", "Pencak Silat", "Paddle Tennis", "P.E. Lesson", "Rafting", "Rugby", 
            "Sailing", "Sepak Takraw", "Shooting", "Softball", "Squash", "Surfing", 
            "Swimming", "Synchronized Swimming", "Table Tennis", "Tarung Derajat", 
            "Tennis", "Triathlon", "Volleyball", "Water Polo", "Water Ski", 
            "Weightlifting", "Wrestling", "Wushu", "Other"
        ];

        // Sport Modal Functions
        let selectedSports = [];
        const MAX_SPORTS = 5;

        function openSportModal() {
            document.getElementById('sport-modal').classList.add('active');
            populateSportList();
        }

        function closeSportModal() {
            document.getElementById('sport-modal').classList.remove('active');
        }

        function populateSportList() {
            const sportList = document.getElementById('sportList');
            sportList.innerHTML = '';
            
            sports.forEach(sport => {
                const alreadySelected = selectedSports.includes(sport);
                const div = document.createElement('div');
                div.className = 'p-2 text-white hover:bg-white/10 rounded cursor-pointer';
                if (alreadySelected) {
                    div.classList.add('bg-white/20');
                }
                div.textContent = sport;
                div.onclick = () => selectSport(sport);
                sportList.appendChild(div);
            });
        }

        function selectSport(sport) {
            if (sport === 'Other') {
                if (!selectedSports.includes(sport)) {
                    if (selectedSports.length < MAX_SPORTS) {
                        selectedSports.push(sport);
                        updateSelectedSportsDisplay();
                        document.getElementById('otherSportContainer').classList.remove('hidden');
                    } else {
                        alert(`You can only select up to ${MAX_SPORTS} sports.`);
                    }
                }
            } else {
                const index = selectedSports.indexOf(sport);
                if (index === -1) {
                    if (selectedSports.length < MAX_SPORTS) {
                        selectedSports.push(sport);
                    } else {
                        alert(`You can only select up to ${MAX_SPORTS} sports.`);
                    }
                } else {
                    selectedSports.splice(index, 1);
                }
                updateSelectedSportsDisplay();
                populateSportList(); // Refresh the list to show selected status
            }
        }

        function updateSelectedSportsDisplay() {
            const container = document.getElementById('selectedSportsContainer');
            const countElement = document.getElementById('selectedSportsCount');
            const hiddenInput = document.getElementById('selectedSports');
            
            container.innerHTML = '';
            countElement.textContent = selectedSports.length.toString();
            
            if (selectedSports.includes('Other')) {
                document.getElementById('otherSportContainer').classList.remove('hidden');
            } else {
                document.getElementById('otherSportContainer').classList.add('hidden');
            }
            
            selectedSports.forEach(sport => {
                const span = document.createElement('span');
                span.className = 'selected-sport';
                span.innerHTML = `${sport} <button type="button" onclick="removeSport('${sport}')">&times;</button>`;
                container.appendChild(span);
            });
            
            hiddenInput.value = selectedSports.join(',');
        }

        function removeSport(sport) {
            const index = selectedSports.indexOf(sport);
            if (index !== -1) {
                selectedSports.splice(index, 1);
                updateSelectedSportsDisplay();
            }
        }

        // Organisation Modal Functions
        function openOrgModal() {
            document.getElementById('org-modal').classList.add('active');
        }

        function closeOrgModal() {
            document.getElementById('org-modal').classList.remove('active');
        }

        function registerOrganisation() {
            // Process organisation registration
            // This would typically involve validation and sending data to the server
            alert('Organisation registered successfully!');
            closeOrgModal();
        }

        // Search functionality
        document.getElementById('sportSearch').addEventListener('input', function(e) {
            const searchTerm = e.target.value.toLowerCase();
            const options = document.querySelectorAll('#sportList > div');
            
            options.forEach(option => {
                if (option.textContent) {
                    const text = option.textContent.toLowerCase();
                    option.style.display = text.includes(searchTerm) ? '' : 'none';
                }
            });
        });

        // Initialize 'Other' sport input handler
        document.getElementById('otherSport').addEventListener('input', function(e) {
            const otherSportValue = e.target.value;
            // Update the hidden input value when 'Other' is selected
            if (selectedSports.includes('Other')) {
                const sportsWithoutOther = selectedSports.filter(s => s !== 'Other');
                document.getElementById('selectedSports').value = [...sportsWithoutOther, `Other: ${otherSportValue}`].join(',');
            }
        });
    </script>
</body>
