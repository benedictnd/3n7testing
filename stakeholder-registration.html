<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stakeholder Registration - 3&7 Training & Recovery Platform</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@popperjs/core@2"></script>
    <script src="https://unpkg.com/tippy.js@6"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'deep-navy': '#09104E',
                        'electric-blue': '#353BFD',
                    },
                    fontFamily: {
                        'poppins': ['Poppins', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        .info-icon {
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background-color: rgba(255, 255, 255, 0.2);
            margin-left: 8px;
            font-size: 12px;
        }

        .tippy-box {
            background-color: rgba(9, 16, 78, 0.95) !important;
            color: white !important;
            border-radius: 8px !important;
            font-size: 14px !important;
            max-width: 300px !important;
            padding: 8px !important;
        }

        select option {
            background-color: white !important;
            color: black !important;
        }
    </style>
</head>
<body class="font-poppins bg-[#09104E]">
    <div class="min-h-screen py-12 px-4 sm:px-6 lg:px-8 relative"
         style="background: linear-gradient(rgba(0, 0, 0, 0.7), rgba(0, 0, 0, 0.7)), url('static/image/Background img.png') center/cover no-repeat fixed;">
        
        <!-- Logo -->
        <div class="absolute top-6 left-6">
            <a href="index.html">
                <img src="static/image/Logo Black.png" alt="Logo" class="h-10 w-auto object-contain brightness-0 invert">
            </a>
        </div>

        <div class="max-w-3xl mx-auto">
            <!-- Header -->
            <div class="text-center mb-12">
                <h2 class="text-3xl font-bold text-white mb-2">Stakeholder Registration</h2>
                <p class="text-gray-300">Join as a Club Owner, Decision Maker, or Parent</p>
            </div>

            <!-- Registration Form -->
            <form action="welcome-animation.html?role=stakeholder" class="space-y-8 bg-[#353BFD] p-8 rounded-xl border border-white/10">
                <!-- Personal Information -->
                <div class="space-y-6">
                    <h3 class="text-xl font-semibold text-white">Personal Information</h3>
                    
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <!-- Full Name -->
                        <div>
                            <label class="block text-sm font-medium text-white mb-2">
                                Full Name
                                <span class="text-red-400">*</span>
                            </label>
                            <input type="text" required
                                class="w-full px-4 py-2 bg-white/10 border border-gray-300/30 rounded-lg focus:ring-2 focus:ring-electric-blue focus:border-transparent text-white">
                        </div>
                        
                        <!-- Email -->
                        <div>
                            <label class="block text-sm font-medium text-white mb-2">
                                Email
                                <span class="text-red-400">*</span>
                            </label>
                            <input type="email" required
                                class="w-full px-4 py-2 bg-white/10 border border-gray-300/30 rounded-lg focus:ring-2 focus:ring-electric-blue focus:border-transparent text-white">
                        </div>
                        
                        <!-- Phone Number -->
                        <div>
                            <label class="block text-sm font-medium text-white mb-2">
                                Phone Number
                                <span class="text-red-400">*</span>
                            </label>
                            <input type="tel" required
                                class="w-full px-4 py-2 bg-white/10 border border-gray-300/30 rounded-lg focus:ring-2 focus:ring-electric-blue focus:border-transparent text-white">
                        </div>

                        <!-- Stakeholder Type -->
                        <div>
                            <label class="block text-sm font-medium text-white mb-2">
                                Stakeholder Type
                                <span class="text-red-400">*</span>
                            </label>
                            <select required id="stakeholderType"
                                class="w-full px-4 py-2 bg-white/10 border border-gray-300/30 rounded-lg focus:ring-2 focus:ring-electric-blue focus:border-transparent text-white">
                                <option value="" disabled selected class="bg-white text-black">Select type</option>
                                <option value="club_owner" class="bg-white text-black">Club Owner</option>
                                <option value="decision_maker" class="bg-white text-black">Decision Maker</option>
                                <option value="parent" class="bg-white text-black">Parent</option>
                                <option value="sponsor" class="bg-white text-black">Sponsor</option>
                                <option value="other" class="bg-white text-black">Other</option>
                            </select>
                        </div>
                    </div>
                </div>

                <!-- Organization Information -->
                <div id="organization-section" class="space-y-6">
                    <h3 class="text-xl font-semibold text-white">Organization Information</h3>
                    
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <!-- Organization Name -->
                        <div>
                            <label class="block text-sm font-medium text-white mb-2">
                                Organization Name
                                <span class="text-red-400">*</span>
                            </label>
                            <input type="text" required
                                class="w-full px-4 py-2 bg-white/10 border border-gray-300/30 rounded-lg focus:ring-2 focus:ring-electric-blue focus:border-transparent text-white">
                        </div>
                        
                        <!-- Organization Type -->
                        <div>
                            <label class="block text-sm font-medium text-white mb-2">
                                Organization Type
                                <span class="text-red-400">*</span>
                            </label>
                            <select required
                                class="w-full px-4 py-2 bg-white/10 border border-gray-300/30 rounded-lg focus:ring-2 focus:ring-electric-blue focus:border-transparent text-white">
                                <option value="" disabled selected class="bg-white text-black">Select type</option>
                                <option value="club" class="bg-white text-black">Sports Club</option>
                                <option value="school" class="bg-white text-black">School</option>
                                <option value="university" class="bg-white text-black">University</option>
                                <option value="government" class="bg-white text-black">Government Agency</option>
                                <option value="company" class="bg-white text-black">Private Company</option>
                                <option value="ngo" class="bg-white text-black">Non-Profit Organization</option>
                                <option value="other" class="bg-white text-black">Other</option>
                            </select>
                        </div>
                        
                        <!-- Position in Organization -->
                        <div>
                            <label class="block text-sm font-medium text-white mb-2">
                                Your Position
                                <span class="text-red-400">*</span>
                            </label>
                            <input type="text" required
                                class="w-full px-4 py-2 bg-white/10 border border-gray-300/30 rounded-lg focus:ring-2 focus:ring-electric-blue focus:border-transparent text-white">
                        </div>
                        
                        <!-- Website -->
                        <div>
                            <label class="block text-sm font-medium text-white mb-2">
                                Website
                            </label>
                            <input type="url"
                                class="w-full px-4 py-2 bg-white/10 border border-gray-300/30 rounded-lg focus:ring-2 focus:ring-electric-blue focus:border-transparent text-white"
                                placeholder="https://example.com">
                        </div>
                    </div>
                    
                    <!-- Organization Description -->
                    <div>
                        <label class="block text-sm font-medium text-white mb-2">
                            Organization Description
                        </label>
                        <textarea rows="3"
                            class="w-full px-4 py-2 bg-white/10 border border-gray-300/30 rounded-lg focus:ring-2 focus:ring-electric-blue focus:border-transparent text-white"
                            placeholder="Tell us about your organization..."></textarea>
                    </div>
                </div>

                <!-- Parent Section (initially hidden) -->
                <div id="parent-section" class="space-y-6 hidden">
                    <h3 class="text-xl font-semibold text-white">Parent Information</h3>
                    
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <!-- Child's Name -->
                        <div>
                            <label class="block text-sm font-medium text-white mb-2">
                                Child's Name
                                <span class="text-red-400">*</span>
                            </label>
                            <input type="text" id="child-name"
                                class="w-full px-4 py-2 bg-white/10 border border-gray-300/30 rounded-lg focus:ring-2 focus:ring-electric-blue focus:border-transparent text-white">
                        </div>
                        
                        <!-- Child's Age -->
                        <div>
                            <label class="block text-sm font-medium text-white mb-2">
                                Child's Age
                                <span class="text-red-400">*</span>
                            </label>
                            <input type="number" id="child-age" min="1" max="30"
                                class="w-full px-4 py-2 bg-white/10 border border-gray-300/30 rounded-lg focus:ring-2 focus:ring-electric-blue focus:border-transparent text-white">
                        </div>
                        
                        <!-- Child's Sport -->
                        <div>
                            <label class="block text-sm font-medium text-white mb-2">
                                Child's Sport
                                <span class="text-red-400">*</span>
                            </label>
                            <input type="text" id="child-sport"
                                class="w-full px-4 py-2 bg-white/10 border border-gray-300/30 rounded-lg focus:ring-2 focus:ring-electric-blue focus:border-transparent text-white">
                        </div>
                        
                        <!-- Child's Club/School -->
                        <div>
                            <label class="block text-sm font-medium text-white mb-2">
                                Child's Club/School
                            </label>
                            <input type="text"
                                class="w-full px-4 py-2 bg-white/10 border border-gray-300/30 rounded-lg focus:ring-2 focus:ring-electric-blue focus:border-transparent text-white">
                        </div>
                    </div>
                    
                    <!-- Add Another Child Button -->
                    <div>
                        <button type="button" onclick="addChildField()"
                            class="px-4 py-2 bg-white/20 text-white rounded-lg hover:bg-white/30 transition-colors">
                            + Add Another Child
                        </button>
                    </div>
                    
                    <!-- Additional Children Container -->
                    <div id="additional-children-container" class="space-y-4">
                        <!-- Additional children will be added here -->
                    </div>
                </div>

                <!-- Interests -->
                <div class="space-y-6">
                    <h3 class="text-xl font-semibold text-white">Areas of Interest</h3>
                    
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div class="flex items-center">
                            <input type="checkbox" id="interest-performance" class="form-checkbox text-electric-blue h-5 w-5 mr-2">
                            <label for="interest-performance" class="text-white">Performance Improvement</label>
                        </div>
                        <div class="flex items-center">
                            <input type="checkbox" id="interest-nutrition" class="form-checkbox text-electric-blue h-5 w-5 mr-2">
                            <label for="interest-nutrition" class="text-white">Nutrition & Diet</label>
                        </div>
                        <div class="flex items-center">
                            <input type="checkbox" id="interest-recovery" class="form-checkbox text-electric-blue h-5 w-5 mr-2">
                            <label for="interest-recovery" class="text-white">Recovery Protocols</label>
                        </div>
                        <div class="flex items-center">
                            <input type="checkbox" id="interest-mental" class="form-checkbox text-electric-blue h-5 w-5 mr-2">
                            <label for="interest-mental" class="text-white">Mental Training</label>
                        </div>
                        <div class="flex items-center">
                            <input type="checkbox" id="interest-data" class="form-checkbox text-electric-blue h-5 w-5 mr-2">
                            <label for="interest-data" class="text-white">Data & Analytics</label>
                        </div>
                        <div class="flex items-center">
                            <input type="checkbox" id="interest-technology" class="form-checkbox text-electric-blue h-5 w-5 mr-2">
                            <label for="interest-technology" class="text-white">Sports Technology</label>
                        </div>
                    </div>
                    
                    <!-- Other Interests -->
                    <div>
                        <label class="block text-sm font-medium text-white mb-2">
                            Other Interests
                        </label>
                        <textarea rows="2"
                            class="w-full px-4 py-2 bg-white/10 border border-gray-300/30 rounded-lg focus:ring-2 focus:ring-electric-blue focus:border-transparent text-white"
                            placeholder="Tell us about other areas you're interested in..."></textarea>
                    </div>
                </div>

                <!-- Password -->
                <div class="space-y-6">
                    <h3 class="text-xl font-semibold text-white">Account Security</h3>
                    
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <!-- Password -->
                        <div>
                            <label class="block text-sm font-medium text-white mb-2">
                                Password
                                <span class="text-red-400">*</span>
                            </label>
                            <input type="password" required minlength="8"
                                class="w-full px-4 py-2 bg-white/10 border border-gray-300/30 rounded-lg focus:ring-2 focus:ring-electric-blue focus:border-transparent text-white">
                            <p class="text-xs text-gray-400 mt-1">Must be at least 8 characters with a number and special character</p>
                        </div>
                        
                        <!-- Confirm Password -->
                        <div>
                            <label class="block text-sm font-medium text-white mb-2">
                                Confirm Password
                                <span class="text-red-400">*</span>
                            </label>
                            <input type="password" required minlength="8"
                                class="w-full px-4 py-2 bg-white/10 border border-gray-300/30 rounded-lg focus:ring-2 focus:ring-electric-blue focus:border-transparent text-white">
                        </div>
                    </div>
                </div>

                <!-- Terms and Privacy -->
                <div class="space-y-4">
                    <div class="flex items-start">
                        <input type="checkbox" id="terms" required class="form-checkbox text-electric-blue h-5 w-5 mt-1 mr-2">
                        <label for="terms" class="text-white text-sm">
                            I agree to the <a href="#" class="underline hover:text-blue-300">Terms of Service</a> and <a href="#" class="underline hover:text-blue-300">Privacy Policy</a>
                            <span class="text-red-400">*</span>
                        </label>
                    </div>
                    
                    <div class="flex items-start">
                        <input type="checkbox" id="marketing" class="form-checkbox text-electric-blue h-5 w-5 mt-1 mr-2">
                        <label for="marketing" class="text-white text-sm">
                            I would like to receive news, updates, and marketing communications
                        </label>
                    </div>
                </div>

                <!-- Submit Button -->
                <div class="flex justify-center">
                    <button type="submit"
                        class="px-8 py-3 bg-transparent text-white rounded-lg border-2 border-white hover:bg-white hover:text-[#353BFD] transition-colors font-medium">
                        Submit Registration
                    </button>
                </div>
            </form>

            <!-- Back Link -->
            <div class="text-center mt-8">
                <a href="role-selection.html" class="text-gray-300 hover:text-white transition-colors">
                    ← Back to Role Selection
                </a>
            </div>
        </div>
    </div>

    <script>
        // Initialize tooltips
        tippy('[data-tippy-content]', {
            placement: 'right',
            arrow: true,
            animation: 'scale',
        });
        
        // Stakeholder type handling
        document.addEventListener('DOMContentLoaded', function() {
            const stakeholderTypeSelect = document.getElementById('stakeholderType');
            const organizationSection = document.getElementById('organization-section');
            const parentSection = document.getElementById('parent-section');
            
            stakeholderTypeSelect.addEventListener('change', function() {
                if (this.value === 'parent') {
                    organizationSection.classList.add('hidden');
                    parentSection.classList.remove('hidden');
                    
                    // Make parent fields required
                    document.getElementById('child-name').setAttribute('required', '');
                    document.getElementById('child-age').setAttribute('required', '');
                    document.getElementById('child-sport').setAttribute('required', '');
                } else {
                    organizationSection.classList.remove('hidden');
                    parentSection.classList.add('hidden');
                    
                    // Remove required attribute from parent fields
                    document.getElementById('child-name').removeAttribute('required');
                    document.getElementById('child-age').removeAttribute('required');
                    document.getElementById('child-sport').removeAttribute('required');
                }
            });
        });
        
        // Add child field for parents
        let childCount = 1;
        
        function addChildField() {
            if (childCount < 5) {
                childCount++;
                const container = document.getElementById('additional-children-container');
                const childDiv = document.createElement('div');
                childDiv.className = 'border border-white/20 rounded-lg p-4';
                childDiv.innerHTML = `
                    <div class="flex justify-between items-center mb-4">
                        <h4 class="text-white font-medium">Child ${childCount}</h4>
                        <button type="button" onclick="removeChildField(this)" class="text-red-400 hover:text-red-300">
                            Remove
                        </button>
                    </div>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-sm font-medium text-white mb-2">
                                Child's Name
                                <span class="text-red-400">*</span>
                            </label>
                            <input type="text" required
                                class="w-full px-4 py-2 bg-white/10 border border-gray-300/30 rounded-lg focus:ring-2 focus:ring-electric-blue focus:border-transparent text-white">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-white mb-2">
                                Child's Age
                                <span class="text-red-400">*</span>
                            </label>
                            <input type="number" required min="1" max="30"
                                class="w-full px-4 py-2 bg-white/10 border border-gray-300/30 rounded-lg focus:ring-2 focus:ring-electric-blue focus:border-transparent text-white">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-white mb-2">
                                Child's Sport
                                <span class="text-red-400">*</span>
                            </label>
                            <input type="text" required
                                class="w-full px-4 py-2 bg-white/10 border border-gray-300/30 rounded-lg focus:ring-2 focus:ring-electric-blue focus:border-transparent text-white">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-white mb-2">
                                Child's Club/School
                            </label>
                            <input type="text"
                                class="w-full px-4 py-2 bg-white/10 border border-gray-300/30 rounded-lg focus:ring-2 focus:ring-electric-blue focus:border-transparent text-white">
                        </div>
                    </div>
                `;
                container.appendChild(childDiv);
            }
        }
        
        function removeChildField(button) {
            button.closest('.border').remove();
            childCount--;
        }
    </script>
</body>
</html>
