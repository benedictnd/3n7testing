<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Support Dashboard - 3&7 Training & Recovery Platform</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="static/css/styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
</head>
<body class="font-inter">
    <header class="header fixed top-0 w-full bg-white/95 z-50">
        <div class="container h-full flex justify-between items-center">
            <img src="static/image/Logo Black.png" alt="Logo" class="h-12 w-auto object-contain">
            <nav class="hidden md:flex gap-8">
                <a href="#home" class="text-gray-700 font-medium hover:text-blue-600 transition-colors">Home</a>
                <a href="#about" class="text-gray-700 font-medium hover:text-blue-600 transition-colors">About</a>
                <a href="#features" class="text-gray-700 font-medium hover:text-blue-600 transition-colors">Features</a>
                <a href="#contact" class="text-gray-700 font-medium hover:text-blue-600 transition-colors">Contact</a>
            </nav>
            <button class="md:hidden text-gray-700" id="mobile-menu-button">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/>
                </svg>
            </button>
        </div>
        <div class="md:hidden hidden" id="mobile-menu">
            <nav class="container py-4 space-y-4">
                <a href="#home" class="block text-gray-700 hover:text-blue-600">Home</a>
                <a href="#about" class="block text-gray-700 hover:text-blue-600">About</a>
                <a href="#features" class="block text-gray-700 hover:text-blue-600">Features</a>
                <a href="#contact" class="block text-gray-700 hover:text-blue-600">Contact</a>
            </nav>
        </div>
    </header>

    <section id="hero" class="hero-section" style="background-image: url('static/image/herofirst.png');">
        <div class="container">
            <div class="section-content">
                <div class="content-text fade-up">
                    <p class="text-base font-normal font-poppins mb-2">It's great to have you back,</p>
                    <h2 class="text-4xl md:text-5xl font-semibold font-poppins mb-2">The real Heroes of 3&7</h2>
                    <p class="text-base font-normal font-poppins mb-8">Let's support our athletes to achieve their best</p>
                    <div class="flex gap-4">
                        <a href="#cases" class="inline-block px-8 py-3 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition-colors">View Cases</a>
                        <a href="#profile" class="inline-block px-8 py-3 bg-white text-blue-600 border border-blue-600 rounded-lg hover:bg-blue-50 transition-colors">View Profile</a>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- Rest of the sections from index.html -->
    <section id="training" class="content-section" style="background-image: url('static/image/training.png');">
        <div class="container">
            <div class="section-content">
                <div class="content-text fade-up">
                    <h2 class="text-4xl md:text-5xl font-bold mb-6">Integrated Training System</h2>
                    <p class="text-lg md:text-xl mb-8">Advanced tracking and analytics for optimal performance.</p>
                    <a href="#learn-more" class="inline-block px-8 py-3 bg-white text-blue-600 rounded-lg hover:bg-gray-100 transition-colors">Learn More</a>
                </div>
            </div>
        </div>
    </section>

    <!-- Include other sections from index.html -->
    <!-- ... -->

    <script src="static/js/main.js"></script>
</body>
</html>
