name: API Quality Gate

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 2 * * *'  # Daily at 2 AM UTC
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target Environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - dev
          - staging
          - prod

env:
  PYTHON_VERSION: '3.10'
  REQUIREMENTS_FILE: 'requirements.txt'
  TEST_REQUIREMENTS_FILE: 'test-requirements.txt'
  TEST_DIR: 'test-logs'
  REPORT_DIR: 'reports'

jobs:
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
      
      - name: Install Security Tools
        run: |
          pip install bandit safety
          
      - name: Create logs directory
        run: mkdir -p ${{ env.TEST_DIR }}
      
      - name: Run Bandit Security Scan
        run: bandit -r routes/ middleware/ dependencies/ -f json -o ${{ env.TEST_DIR }}/security-scan.json
        continue-on-error: true
      
      - name: Run Safety Checks
        run: safety check -r ${{ env.REQUIREMENTS_FILE }} --json > ${{ env.TEST_DIR }}/safety-report.json
        continue-on-error: true
      
      - uses: actions/upload-artifact@v3
        with:
          name: security-reports
          path: ${{ env.TEST_DIR }}/*.json

  mock-api:
    name: Start Mock API
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
      
      - name: Install Dependencies
        run: |
          pip install fastapi uvicorn pydantic requests
      
      - name: Start Mock API
        run: |
          python mock_api.py &
          sleep 5
          
      - name: Verify Mock API is Running
        run: python check_api.py http://localhost:8000
      
      - name: API Status
        run: |
          echo "Mock API is running on port 8000"
          curl -s http://localhost:8000/health

  api-tests:
    name: API Tests
    runs-on: ${{ matrix.os }}
    needs: security-scan
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        include:
          - os: ubuntu-latest
            path_separator: /
          - os: windows-latest
            path_separator: \\ 
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
      
      - name: Create Directories
        shell: bash
        run: |
          mkdir -p ${{ env.TEST_DIR }}
          mkdir -p ${{ env.REPORT_DIR }}
      
      - name: Install Dependencies
        run: |
          pip install -r ${{ env.TEST_REQUIREMENTS_FILE }}
      
      - name: Start Mock API (Windows)
        if: matrix.os == 'windows-latest'
        shell: cmd
        run: |
          start /b python mock_api.py
          timeout /t 5
          python check_api.py http://localhost:8000
      
      - name: Start Mock API (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          python mock_api.py &
          sleep 5
          python check_api.py http://localhost:8000
      
      - name: Run API Tests
        run: |
          python run_api_tests.py --url "http://localhost:8000" --email "test@example.com" --password "password123" --verbose
      
      - name: Run Standard Tests
        run: |
          python -m pytest tests/security tests/performance tests/integration --junitxml=${{ env.TEST_DIR }}/api-tests-${{ matrix.os }}.xml
      
      - name: Generate Test Report
        run: |
          python generate_report.py --input-dir ${{ env.TEST_DIR }} --output-file ${{ env.REPORT_DIR }}/api-report-${{ matrix.os }}.html
      
      - uses: actions/upload-artifact@v3
        with:
          name: api-test-results-${{ matrix.os }}
          path: |
            ${{ env.TEST_DIR }}/*.xml
            ${{ env.TEST_DIR }}/*.json
            ${{ env.REPORT_DIR }}/*.html

  performance-tests:
    name: Performance Tests
    runs-on: ubuntu-latest
    needs: api-tests
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
      
      - name: Create Directories
        run: |
          mkdir -p ${{ env.TEST_DIR }}
          mkdir -p ${{ env.REPORT_DIR }}
      
      - name: Install Dependencies
        run: |
          pip install -r ${{ env.TEST_REQUIREMENTS_FILE }}
      
      - name: Start Mock API
        run: |
          python mock_api.py &
          sleep 5
          python check_api.py http://localhost:8000
      
      - name: Run Load Test
        run: |
          locust -f locustfile.py --headless -u 50 -r 10 --run-time 1m --host http://localhost:8000 -c EmailTestUser --html ${{ env.REPORT_DIR }}/load-test-report.html
        continue-on-error: true
      
      - name: Generate Performance Graphs
        run: |
          python scripts/benchmark_api.py --base-url http://localhost:8000 --output ${{ env.REPORT_DIR }}/performance-metrics.json
      
      - uses: actions/upload-artifact@v3
        with:
          name: performance-reports
          path: |
            ${{ env.REPORT_DIR }}/load-test-report.html
            ${{ env.REPORT_DIR }}/performance-metrics.json

  reporting:
    name: Generate Final Report
    runs-on: ubuntu-latest
    needs: [security-scan, api-tests, performance-tests]
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
      
      - name: Install Reporting Tools
        run: |
          pip install jinja2 matplotlib
      
      - name: Create Directories
        run: |
          mkdir -p ${{ env.REPORT_DIR }}
      
      - name: Download All Artifacts
        uses: actions/download-artifact@v3
        with:
          path: artifacts
      
      - name: Generate Consolidated Report
        run: |
          python generate_report.py \
            --input-dir artifacts \
            --output-file ${{ env.REPORT_DIR }}/consolidated-report.html
      
      - name: Upload Final Report
        uses: actions/upload-artifact@v3
        with:
          name: quality-report
          path: ${{ env.REPORT_DIR }}/consolidated-report.html
      
      - name: Send Email Notification if Failed
        if: ${{ failure() }}
        run: |
          echo "API Tests failed. Check the logs for details."
          # Email notification would be implemented here with appropriate tooling 