services:
  backend:
    build: .
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/training_platform
      - REDIS_URL=redis://redis:6379
      - SECRET_KEY=secure_development_key_replace_in_production
      - JWT_SECRET=secure_jwt_secret_for_development
      - COOKIE_SECRET=secure_cookie_secret_for_development
      - ENVIRONMENT=development
      - PORT=8000
    volumes:
      - .:/app
    depends_on:
      - postgres
      - redis
    env_file:
      - .env
    restart: unless-stopped

  postgres:
    image: postgres:14
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=training_platform
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
