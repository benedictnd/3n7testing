<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Support Staff Registration - 3&7 Training & Recovery Platform</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@popperjs/core@2"></script>
    <script src="https://unpkg.com/tippy.js@6"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'deep-navy': '#09104E',
                        'electric-blue': '#5257FA',
                    },
                    fontFamily: {
                        'poppins': ['Poppins', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        .info-icon {
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background-color: rgba(255, 255, 255, 0.2);
            margin-left: 8px;
            font-size: 12px;
        }

        .tippy-box {
            background-color: rgba(9, 16, 78, 0.95) !important;
            color: white !important;
            border-radius: 8px !important;
            font-size: 14px !important;
            max-width: 300px !important;
            padding: 8px !important;
        }

        select option {
            background-color: white !important;
            color: black !important;
        }
    </style>
</head>
<body class="font-poppins bg-[#09104E]">
    <div class="min-h-screen py-12 px-4 sm:px-6 lg:px-8 relative"
         style="background: linear-gradient(rgba(0, 0, 0, 0.7), rgba(0, 0, 0, 0.7)), url('static/image/Background img.png') center/cover no-repeat fixed;">
        
        <!-- Logo -->
        <div class="absolute top-6 left-6">
            <a href="index.html">
                <img src="static/image/Logo Black.png" alt="Logo" class="h-10 w-auto object-contain brightness-0 invert">
            </a>
        </div>

        <div class="max-w-3xl mx-auto">
            <!-- Header -->
            <div class="text-center mb-12">
                <h2 class="text-3xl font-bold text-white mb-2">Support Staff Registration</h2>
                <p class="text-gray-300">Join as Medical, Mental Health, or Recovery Professional</p>
            </div>

            <!-- Registration Form -->
            <form action="welcome-animation.html?role=support" class="space-y-8 bg-[#5257FA] p-8 rounded-xl border border-white/10">
                <!-- Personal Information -->
                <div class="space-y-6">
                    <h3 class="text-xl font-semibold text-white">Personal Information</h3>
                    
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <!-- Full Name -->
                        <div>
                            <label class="block text-sm font-medium text-white mb-2">
                                Full Name
                                <span class="text-red-400">*</span>
                            </label>
                            <input type="text" required
                                class="w-full px-4 py-2 bg-white/10 border border-gray-300/30 rounded-lg focus:ring-2 focus:ring-electric-blue focus:border-transparent text-white">
                        </div>

                        <!-- Email -->
                        <div>
                            <label class="block text-sm font-medium text-white mb-2">
                                Email
                                <span class="text-red-400">*</span>
                            </label>
                            <input type="email" required
                                class="w-full px-4 py-2 bg-white/10 border border-gray-300/30 rounded-lg focus:ring-2 focus:ring-electric-blue focus:border-transparent text-white">
                        </div>

                        <!-- Phone Number -->
                        <div>
                            <label class="block text-sm font-medium text-white mb-2">
                                Phone Number
                                <span class="text-red-400">*</span>
                            </label>
                            <input type="tel" required
                                class="w-full px-4 py-2 bg-white/10 border border-gray-300/30 rounded-lg focus:ring-2 focus:ring-electric-blue focus:border-transparent text-white">
                        </div>

                        <!-- Support Role Type -->
                        <div>
                            <label class="block text-sm font-medium text-white mb-2">
                                Support Role
                                <span class="text-red-400">*</span>
                            </label>
                            <select required id="supportRole"
                                class="w-full px-4 py-2 bg-white/10 border border-gray-300/30 rounded-lg focus:ring-2 focus:ring-electric-blue focus:border-transparent text-white">
                                <option value="" disabled selected class="bg-white text-black">Select role</option>
                                <option value="medical" class="bg-white text-black">Medical Professional</option>
                                <option value="mental" class="bg-white text-black">Mental Health Professional</option>
                                <option value="recovery" class="bg-white text-black">Recovery Specialist</option>
                                <option value="nutrition" class="bg-white text-black">Nutritionist/Dietitian</option>
                                <option value="physio" class="bg-white text-black">Physiotherapist</option>
                                <option value="strength" class="bg-white text-black">Strength & Conditioning</option>
                                <option value="other" class="bg-white text-black">Other Support Role</option>
                            </select>
                        </div>
                    </div>
                </div>

                <!-- Professional Information -->
                <div class="space-y-6">
                    <h3 class="text-xl font-semibold text-white">Professional Information</h3>
                    
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <!-- Professional Title -->
                        <div>
                            <label class="block text-sm font-medium text-white mb-2">
                                Professional Title
                                <span class="text-red-400">*</span>
                            </label>
                            <input type="text" required
                                class="w-full px-4 py-2 bg-white/10 border border-gray-300/30 rounded-lg focus:ring-2 focus:ring-electric-blue focus:border-transparent text-white"
                                placeholder="e.g., Physical Therapist, Sports Psychologist">
                        </div>
                        
                        <!-- Years of Experience -->
                        <div>
                            <label class="block text-sm font-medium text-white mb-2">
                                Years of Experience
                                <span class="text-red-400">*</span>
                            </label>
                            <input type="number" required min="0" max="70"
                                class="w-full px-4 py-2 bg-white/10 border border-gray-300/30 rounded-lg focus:ring-2 focus:ring-electric-blue focus:border-transparent text-white">
                        </div>

                        <!-- License/Certification Number -->
                        <div>
                            <label class="block text-sm font-medium text-white mb-2">
                                License/Certification Number
                                <span class="text-red-400">*</span>
                            </label>
                            <input type="text" required
                                class="w-full px-4 py-2 bg-white/10 border border-gray-300/30 rounded-lg focus:ring-2 focus:ring-electric-blue focus:border-transparent text-white">
                        </div>

                        <!-- Specialization -->
                        <div>
                            <label class="block text-sm font-medium text-white mb-2">
                                Specialization
                                <span class="text-red-400">*</span>
                            </label>
                            <input type="text" required
                                class="w-full px-4 py-2 bg-white/10 border border-gray-300/30 rounded-lg focus:ring-2 focus:ring-electric-blue focus:border-transparent text-white"
                                placeholder="e.g., Orthopedics, Sports Performance">
                        </div>
                    </div>
                    
                    <!-- Educational Background -->
                    <div>
                        <label class="block text-sm font-medium text-white mb-2">
                            Educational Background
                            <span class="text-red-400">*</span>
                        </label>
                        <textarea required rows="3"
                            class="w-full px-4 py-2 bg-white/10 border border-gray-300/30 rounded-lg focus:ring-2 focus:ring-electric-blue focus:border-transparent text-white"
                            placeholder="List your degrees, institutions, and graduation years"></textarea>
                    </div>
                    
                    <!-- Professional Bio -->
                    <div>
                        <label class="block text-sm font-medium text-white mb-2">
                            Professional Bio
                            <span class="text-red-400">*</span>
                        </label>
                        <textarea required rows="4"
                            class="w-full px-4 py-2 bg-white/10 border border-gray-300/30 rounded-lg focus:ring-2 focus:ring-electric-blue focus:border-transparent text-white"
                            placeholder="Describe your professional background, approach, and philosophy"></textarea>
                    </div>
                </div>

                <!-- Sports Experience -->
                <div class="space-y-6">
                    <h3 class="text-xl font-semibold text-white">Sports Experience</h3>
                    
                    <div class="space-y-4">
                        <!-- Sports Worked With -->
                        <div>
                            <label class="block text-sm font-medium text-white mb-2">
                                Sports You've Worked With
                                <span class="text-red-400">*</span>
                            </label>
                            <div class="grid grid-cols-2 md:grid-cols-3 gap-2">
                                <div class="flex items-center">
                                    <input type="checkbox" id="sport-football" class="form-checkbox text-electric-blue h-5 w-5 mr-2">
                                    <label for="sport-football" class="text-white">Football</label>
                                </div>
                                <div class="flex items-center">
                                    <input type="checkbox" id="sport-basketball" class="form-checkbox text-electric-blue h-5 w-5 mr-2">
                                    <label for="sport-basketball" class="text-white">Basketball</label>
                                </div>
                                <div class="flex items-center">
                                    <input type="checkbox" id="sport-athletics" class="form-checkbox text-electric-blue h-5 w-5 mr-2">
                                    <label for="sport-athletics" class="text-white">Athletics</label>
                                </div>
                                <div class="flex items-center">
                                    <input type="checkbox" id="sport-swimming" class="form-checkbox text-electric-blue h-5 w-5 mr-2">
                                    <label for="sport-swimming" class="text-white">Swimming</label>
                                </div>
                                <div class="flex items-center">
                                    <input type="checkbox" id="sport-tennis" class="form-checkbox text-electric-blue h-5 w-5 mr-2">
                                    <label for="sport-tennis" class="text-white">Tennis</label>
                                </div>
                                <div class="flex items-center">
                                    <input type="checkbox" id="sport-martial" class="form-checkbox text-electric-blue h-5 w-5 mr-2">
                                    <label for="sport-martial" class="text-white">Martial Arts</label>
                                </div>
                            </div>
                            <input type="text" placeholder="Other sports..."
                                class="w-full px-4 py-2 mt-2 bg-white/10 border border-gray-300/30 rounded-lg focus:ring-2 focus:ring-electric-blue focus:border-transparent text-white">
                        </div>

                        <!-- Level of Athletes -->
                        <div>
                            <label class="block text-sm font-medium text-white mb-2">
                                Level of Athletes You've Worked With
                                <span class="text-red-400">*</span>
                            </label>
                            <div class="grid grid-cols-1 md:grid-cols-2 gap-2">
                                <div class="flex items-center">
                                    <input type="checkbox" id="level-recreational" class="form-checkbox text-electric-blue h-5 w-5 mr-2">
                                    <label for="level-recreational" class="text-white">Recreational</label>
                                </div>
                                <div class="flex items-center">
                                    <input type="checkbox" id="level-youth" class="form-checkbox text-electric-blue h-5 w-5 mr-2">
                                    <label for="level-youth" class="text-white">Youth/School</label>
                                </div>
                                <div class="flex items-center">
                                    <input type="checkbox" id="level-collegiate" class="form-checkbox text-electric-blue h-5 w-5 mr-2">
                                    <label for="level-collegiate" class="text-white">Collegiate</label>
                                </div>
                                <div class="flex items-center">
                                    <input type="checkbox" id="level-professional" class="form-checkbox text-electric-blue h-5 w-5 mr-2">
                                    <label for="level-professional" class="text-white">Professional</label>
                                </div>
                                <div class="flex items-center">
                                    <input type="checkbox" id="level-elite" class="form-checkbox text-electric-blue h-5 w-5 mr-2">
                                    <label for="level-elite" class="text-white">Elite/Olympic</label>
                                </div>
                            </div>
                        </div>

                        <!-- Notable Experiences -->
                        <div>
                            <label class="block text-sm font-medium text-white mb-2">
                                Notable Experiences
                            </label>
                            <textarea rows="3"
                                class="w-full px-4 py-2 bg-white/10 border border-gray-300/30 rounded-lg focus:ring-2 focus:ring-electric-blue focus:border-transparent text-white"
                                placeholder="Highlight any special experiences, teams, or events you've worked with"></textarea>
                        </div>
                    </div>
                </div>

                <!-- Services Offered -->
                <div class="space-y-6">
                    <h3 class="text-xl font-semibold text-white">Services Offered</h3>
                    
                    <div id="services-container" class="space-y-4">
                        <div class="flex items-center gap-2">
                            <input type="text" required placeholder="Service name (e.g., Injury Assessment)"
                                class="flex-1 px-4 py-2 bg-white/10 border border-gray-300/30 rounded-lg focus:ring-2 focus:ring-electric-blue focus:border-transparent text-white">
                            <button type="button" onclick="addServiceField()"
                                class="px-4 py-2 bg-white/20 text-white rounded-lg hover:bg-white/30 transition-colors">
                                +
                            </button>
                        </div>
                    </div>
                </div>

                <!-- Password -->
                <div class="space-y-6">
                    <h3 class="text-xl font-semibold text-white">Account Security</h3>
                    
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <!-- Password -->
                        <div>
                            <label class="block text-sm font-medium text-white mb-2">
                                Password
                                <span class="text-red-400">*</span>
                            </label>
                            <input type="password" required minlength="8"
                                class="w-full px-4 py-2 bg-white/10 border border-gray-300/30 rounded-lg focus:ring-2 focus:ring-electric-blue focus:border-transparent text-white">
                            <p class="text-xs text-gray-400 mt-1">Must be at least 8 characters with a number and special character</p>
                        </div>

                        <!-- Confirm Password -->
                        <div>
                            <label class="block text-sm font-medium text-white mb-2">
                                Confirm Password
                                <span class="text-red-400">*</span>
                            </label>
                            <input type="password" required minlength="8"
                                class="w-full px-4 py-2 bg-white/10 border border-gray-300/30 rounded-lg focus:ring-2 focus:ring-electric-blue focus:border-transparent text-white">
                        </div>
                    </div>
                </div>

                <!-- Terms and Privacy -->
                <div class="space-y-4">
                    <div class="flex items-start">
                        <input type="checkbox" id="terms" required class="form-checkbox text-electric-blue h-5 w-5 mt-1 mr-2">
                        <label for="terms" class="text-white text-sm">
                            I agree to the <a href="#" class="underline hover:text-blue-300">Terms of Service</a> and <a href="#" class="underline hover:text-blue-300">Privacy Policy</a>
                            <span class="text-red-400">*</span>
                        </label>
                    </div>
                    
                    <div class="flex items-start">
                        <input type="checkbox" id="verification" required class="form-checkbox text-electric-blue h-5 w-5 mt-1 mr-2">
                        <label for="verification" class="text-white text-sm">
                            I affirm that all information provided is true and accurate, and I understand that my credentials may be verified
                            <span class="text-red-400">*</span>
                        </label>
                    </div>
                    
                    <div class="flex items-start">
                        <input type="checkbox" id="marketing" class="form-checkbox text-electric-blue h-5 w-5 mt-1 mr-2">
                        <label for="marketing" class="text-white text-sm">
                            I would like to receive news, updates, and marketing communications
                            </label>
                    </div>
                </div>

                <!-- Submit Button -->
                <div class="flex justify-center">
                    <button type="submit"
                        class="px-8 py-3 bg-transparent text-white rounded-lg border-2 border-white hover:bg-white hover:text-[#5257FA] transition-colors font-medium">
                        Submit Registration
                    </button>
                </div>
            </form>

            <!-- Back Link -->
            <div class="text-center mt-8">
                <a href="role-selection.html" class="text-gray-300 hover:text-white transition-colors">
                    ← Back to Role Selection
                </a>
            </div>
        </div>
    </div>

    <script>
        // Initialize tooltips
        tippy('[data-tippy-content]', {
            placement: 'right',
            arrow: true,
            animation: 'scale',
        });

        // Service field management
        let serviceCount = 1;
        
        function addServiceField() {
            if (serviceCount < 10) {
                serviceCount++;
                const container = document.getElementById('services-container');
                const div = document.createElement('div');
                div.className = 'flex items-center gap-2';
                div.innerHTML = `
                    <input type="text" placeholder="Service name"
                        class="flex-1 px-4 py-2 bg-white/10 border border-gray-300/30 rounded-lg focus:ring-2 focus:ring-electric-blue focus:border-transparent text-white">
                    <button type="button" onclick="removeServiceField(this)"
                        class="px-4 py-2 bg-red-500 text-white rounded-lg hover:bg-red-600">
                        -
                    </button>
                `;
                container.appendChild(div);
            }
        }

        function removeServiceField(button) {
            button.parentElement.remove();
            serviceCount--;
        }
    </script>
</body>
</html>
