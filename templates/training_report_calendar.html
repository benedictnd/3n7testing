<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Training Report & Calendar | 3&7</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <style>
        :root {
            --color-core: #3b82f6;
            --color-endurance: #10b981;
            --color-strength: #f59e0b;
            --color-flexibility: #8b5cf6;
            --color-other: #6b7280;
        }
        .session-indicator {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            margin: 1px;
        }
        .session-core { background-color: var(--color-core); }
        .session-endurance { background-color: var(--color-endurance); }
        .calendar-day:hover { background-color: #f3f4f6; }
        .calendar-day.has-session { cursor: pointer; }
    </style>
</head>
<body class="bg-gray-50 font-[Poppins]">
    <div class="container mx-auto px-4 py-8 max-w-7xl">
        <!-- Header -->
        <header class="mb-8">
            <div class="flex justify-between items-center mb-4">
                <h1 class="text-3xl font-semibold text-gray-800">Training Report & Calendar</h1>
                <div class="flex items-center gap-4">
                    <input type="text" id="monthPicker" class="px-4 py-2 border rounded-lg" placeholder="Select Month">
                    <button id="downloadReport" class="bg-blue-600 text-white px-6 py-2 rounded-lg hover:bg-blue-700">
                        Download Report
                    </button>
                </div>
            </div>
        </header>

        <!-- Weekly Sessions Chart -->
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-6 mb-8">
            <div class="bg-white rounded-lg shadow-sm p-6">
                <h2 class="text-xl font-medium text-gray-700 mb-4">Weekly Training Sessions</h2>
                <div class="h-[300px]">
                    <canvas id="weeklySessionsChart"></canvas>
                </div>
            </div>

            <!-- Key Statistics -->
            <div class="bg-white rounded-lg shadow-sm p-6">
                <h2 class="text-xl font-medium text-gray-700 mb-4">Key Statistics</h2>
                <div class="grid grid-cols-2 gap-6">
                    <div>
                        <p class="text-gray-600 text-sm">Total Sessions</p>
                        <p class="text-3xl font-semibold text-blue-600" id="totalSessions">0</p>
                    </div>
                    <div>
                        <p class="text-gray-600 text-sm">Core Training</p>
                        <p class="text-3xl font-semibold text-blue-600" id="coreSessions">0</p>
                    </div>
                    <div>
                        <p class="text-gray-600 text-sm">Endurance Training</p>
                        <p class="text-3xl font-semibold text-green-600" id="enduranceSessions">0</p>
                    </div>
                    <div>
                        <p class="text-gray-600 text-sm">Average Duration</p>
                        <p class="text-3xl font-semibold text-purple-600" id="avgDuration">0h</p>
                    </div>
                </div>
            </div>
        </div>

        <!-- Calendar -->
        <div class="bg-white rounded-lg shadow-sm p-6 mb-8">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-xl font-medium text-gray-700">Training Calendar</h2>
                <div class="flex items-center gap-2">
                    <div class="flex items-center gap-1">
                        <span class="session-indicator session-core"></span>
                        <span class="text-sm text-gray-600">Core</span>
                    </div>
                    <div class="flex items-center gap-1">
                        <span class="session-indicator session-endurance"></span>
                        <span class="text-sm text-gray-600">Endurance</span>
                    </div>
                </div>
            </div>
            <div class="grid grid-cols-7 gap-px bg-gray-200">
                <!-- Calendar Header -->
                <div class="text-center py-2 bg-gray-100 font-medium">Sun</div>
                <div class="text-center py-2 bg-gray-100 font-medium">Mon</div>
                <div class="text-center py-2 bg-gray-100 font-medium">Tue</div>
                <div class="text-center py-2 bg-gray-100 font-medium">Wed</div>
                <div class="text-center py-2 bg-gray-100 font-medium">Thu</div>
                <div class="text-center py-2 bg-gray-100 font-medium">Fri</div>
                <div class="text-center py-2 bg-gray-100 font-medium">Sat</div>
                <!-- Calendar Days (will be populated by JavaScript) -->
                <div id="calendarDays" class="contents"></div>
            </div>
        </div>

        <!-- Summary Totals -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <div class="bg-white rounded-lg shadow-sm p-6">
                <h2 class="text-xl font-medium text-gray-700 mb-4">Team Sessions</h2>
                <canvas id="teamSessionsChart"></canvas>
            </div>
            <div class="bg-white rounded-lg shadow-sm p-6">
                <h2 class="text-xl font-medium text-gray-700 mb-4">Personal Progress</h2>
                <canvas id="personalProgressChart"></canvas>
            </div>
        </div>
    </div>

    <script>
        // Initialize Flatpickr for month selection
        flatpickr("#monthPicker", {
            dateFormat: "F Y",
            defaultDate: "today",
            plugins: [new monthSelectPlugin({
                shorthand: true,
                dateFormat: "F Y",
                altFormat: "F Y"
            })]
        });

        // Initialize Charts
        function initializeWeeklyChart() {
            const ctx = document.getElementById('weeklySessionsChart').getContext('2d');
            const data = {
                labels: ['Week 1', 'Week 2', 'Week 3', 'Week 4'],
                datasets: [{
                    label: 'Core Training',
                    data: [4, 5, 3, 6],
                    backgroundColor: 'var(--color-core)',
                    stack: 'Stack 0'
                }, {
                    label: 'Endurance Training',
                    data: [3, 4, 2, 5],
                    backgroundColor: 'var(--color-endurance)',
                    stack: 'Stack 0'
                }]
            };

            new Chart(ctx, {
                type: 'bar',
                data: data,
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: {
                        x: { stacked: true },
                        y: { stacked: true }
                    }
                }
            });
        }

        function initializeTeamChart() {
            const ctx = document.getElementById('teamSessionsChart').getContext('2d');
            const data = {
                labels: ['Core', 'Endurance'],
                datasets: [{
                    data: [65, 35],
                    backgroundColor: [
                        'var(--color-core)',
                        'var(--color-endurance)'
                    ]
                }]
            };

            new Chart(ctx, {
                type: 'doughnut',
                data: data,
                options: {
                    responsive: true,
                    plugins: {
                        legend: {
                            position: 'bottom'
                        }
                    }
                }
            });
        }

        function initializePersonalChart() {
            const ctx = document.getElementById('personalProgressChart').getContext('2d');
            const data = {
                labels: ['Training Quality', 'Expectations', 'Body Condition', 'Intensity'],
                datasets: [{
                    label: 'Current Month',
                    data: [4.5, 4.2, 8.5, 7.8],
                    fill: true,
                    backgroundColor: 'rgba(59, 130, 246, 0.2)',
                    borderColor: 'rgb(59, 130, 246)',
                    pointBackgroundColor: 'rgb(59, 130, 246)',
                    pointBorderColor: '#fff',
                    pointHoverBackgroundColor: '#fff',
                    pointHoverBorderColor: 'rgb(59, 130, 246)'
                }]
            };

            new Chart(ctx, {
                type: 'radar',
                data: data,
                options: {
                    elements: {
                        line: {
                            borderWidth: 3
                        }
                    },
                    scales: {
                        r: {
                            angleLines: {
                                display: true
                            },
                            suggestedMin: 0,
                            suggestedMax: 10
                        }
                    }
                }
            });
        }

        // Generate Calendar Days
        function generateCalendar(year, month) {
            const firstDay = new Date(year, month, 1);
            const lastDay = new Date(year, month + 1, 0);
            const startingDay = firstDay.getDay();
            const totalDays = lastDay.getDate();
            
            const calendarDays = document.getElementById('calendarDays');
            calendarDays.innerHTML = '';

            // Add empty cells for days before the first day of the month
            for (let i = 0; i < startingDay; i++) {
                const emptyDay = document.createElement('div');
                emptyDay.className = 'bg-white p-2 min-h-[100px]';
                calendarDays.appendChild(emptyDay);
            }

            // Add days of the month
            for (let day = 1; day <= totalDays; day++) {
                const dayCell = document.createElement('div');
                dayCell.className = 'calendar-day bg-white p-2 min-h-[100px]';
                
                // Add day number
                const dayNumber = document.createElement('div');
                dayNumber.className = 'text-right text-gray-600 mb-2';
                dayNumber.textContent = day;
                dayCell.appendChild(dayNumber);

                // Add session indicators (example)
                if (Math.random() > 0.5) {
                    const indicator = document.createElement('div');
                    indicator.className = `session-indicator ${Math.random() > 0.5 ? 'session-core' : 'session-endurance'}`;
                    dayCell.appendChild(indicator);
                    dayCell.classList.add('has-session');
                }

                calendarDays.appendChild(dayCell);
            }
        }

        // Initialize everything when the page loads
        document.addEventListener('DOMContentLoaded', function() {
            initializeWeeklyChart();
            initializeTeamChart();
            initializePersonalChart();

            const today = new Date();
            generateCalendar(today.getFullYear(), today.getMonth());

            // Update statistics
            document.getElementById('totalSessions').textContent = '45';
            document.getElementById('coreSessions').textContent = '28';
            document.getElementById('enduranceSessions').textContent = '17';
            document.getElementById('avgDuration').textContent = '1.5h';

            // Handle download report button
            document.getElementById('downloadReport').addEventListener('click', function() {
                alert('Downloading report...');
                // TODO: Implement report download functionality
            });
        });
    </script>
</body>
</html>
